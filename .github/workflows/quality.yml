name: Quality Checks

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit diagnostic
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e "const fs = require('node:fs'); const a = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(JSON.stringify({metadata: a.metadata?.vulnerabilities, vulnerabilities: Object.entries(a.vulnerabilities || {}).map(([name, v]) => ({name, severity: v.severity, isDirect: v.isDirect, range: v.range, fixAvailable: v.fixAvailable, via: v.via.map(x => typeof x === 'string' ? {name: x} : {name: x.name, title: x.title, url: x.url, range: x.range})}))}, null, 2))" "$RUNNER_TEMP/npm-audit.json"

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
