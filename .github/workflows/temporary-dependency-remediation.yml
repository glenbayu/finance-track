name: Temporary dependency remediation

on:
  push:
    branches:
      - "codex/dependency-audit-fix"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade vulnerable direct Next.js dependencies
        run: npm install --save-exact next@16.4.3 eslint-config-next@16.4.3

      - name: Apply non-breaking audited dependency fixes
        run: npm audit fix

      - name: Verify lint, types, and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit updated dependency lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: remediate audited npm vulnerabilities"
          git push origin "HEAD:${GITHUB_REF_NAME}"
