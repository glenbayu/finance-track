<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fjBgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#193f2d"/>
      <stop offset="100%" stop-color="#0b1e15"/>
    </linearGradient>
    <linearGradient id="fjApexGrad" x1="69" y1="82" x2="69" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="fjGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Super-ellipse Squircle Background -->
  <rect width="100" height="100" rx="22.5" fill="url(#fjBgGrad)"/>
  <!-- Subtle Inner Border Highlight -->
  <rect x="0.5" y="0.5" width="99" height="99" rx="22" fill="none" stroke="white" stroke-opacity="0.12"/>

  <!-- 4 Ascending Semicircular Capsule Pills (100% Round Caps, Zero Sharp Edges) -->
  <!-- Pillar 1 -->
  <rect x="18" y="56" width="11" height="26" rx="5.5" fill="#4E8570"/>
  <!-- Pillar 2 -->
  <rect x="35" y="44" width="11" height="38" rx="5.5" fill="#6FA08C"/>
  <!-- Pillar 3 -->
  <rect x="52" y="34" width="11" height="48" rx="5.5" fill="#86EFAC"/>
  <!-- Pillar 4 (Apex) -->
  <rect x="69" y="32" width="11" height="50" rx="5.5" fill="url(#fjApexGrad)"/>

  <!-- Floating Beacon Crest (100% Whole, Safe Margin cy=18) -->
  <circle cx="74.5" cy="18" r="10" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="2.5 2.5" opacity="0.6"/>
  <circle cx="74.5" cy="18" r="5.5" fill="#FFFFFF" filter="url(#fjGlow)"/>
  <circle cx="74.5" cy="18" r="2.8" fill="#34d399"/>
</svg>
