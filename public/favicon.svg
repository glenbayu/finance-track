<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a6b56"/>
      <stop offset="100%" stop-color="#0f4535"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="12" y1="40" x2="52" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- Subtle inner highlight -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="white" stroke-opacity="0.08"/>
  <!-- Bar chart bars -->
  <rect x="12" y="38" width="8" height="12" rx="2" fill="white" fill-opacity="0.25"/>
  <rect x="23" y="29" width="8" height="21" rx="2" fill="white" fill-opacity="0.4"/>
  <rect x="34" y="34" width="8" height="16" rx="2" fill="white" fill-opacity="0.3"/>
  <rect x="45" y="22" width="8" height="28" rx="2" fill="url(#lineGrad)"/>
  <!-- Trend line -->
  <polyline points="16,37 27,27 38,32 49,20" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot at peak -->
  <circle cx="49" cy="20" r="3" fill="#6ee7b7"/>
</svg>
